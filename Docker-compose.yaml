version: '3'

services:

  cnncls:
    image: 478982785567.dkr.ecr.us-east-1.amazonaws.com/mlops_project:latest
    container_name: cnncls

    ports:
      - "8080:8080"

    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: grafana

    ports:
      - "3000:3000"

    restart: unless-stopped